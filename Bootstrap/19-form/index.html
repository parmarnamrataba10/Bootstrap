<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
  
    <div class="container shadow border border-2">
          <h1 class="text-center">Forms</h1>
        <div class="row">
            <div class="col">
                <form>
                    <div class="m-3">
                        <label for="Name">Name</label>
                        <input type="text" placeholder="enter your name">
                    </div>
                    <div class="m-3">
                        <label for="Name" class="form-lable">Name</label>
                        <input type="text" class="form-control" placeholder="enter your name">
                    </div>
                    <div class="m-3">
                        <label for="Email" class="form-lable">Email</label>
                        <input type="email" class="form-control"value="example@gmail.com" readonly>
                    </div>
                    <div class="m-3">
                        <label for="Number" class="form-lable">Number</label>
                        <input type="number" class="form-control">
                        <small class="form-text  text-muted">+91 only</small>
                    </div>
                    <div class="m-3">
                         <input type="checkbox" class="form-control-check">
                        <label for="check" class="form-lable-check"> I agree terms and condition</label> 
                    </div>
                     <div class="m-3">
                         <input type="radio" class="form-control-input" name="answer">
                        <label for="check" class="form-lable-check">Yes</label> 
                          <input type="radio" class="form-control-check" name="answer">
                        <label for="check" class="form-lable-check">No</label> 
                    </div>
                    <div class="m-3">
                        <label for="city"class="form-lable-lg">City</label>
                        <input type="text" class="form-control form-control-lg" placeholder="enter your city">
                    </div>
                    <div class="m-3">
                        <label for="city"class="form-lable-sm">Street-name</label>
                        <input type="text" class="form-control form-control-sm" placeholder="enter your Streetname">
                    </div>
                     <div class="m-3">
                        <label for="city"class="form-lable">State-name</label>
                        <input type="text" class="form-control form-control" placeholder="enter your State">
                    </div>
                    <div class="m-3">
                        <input type="text" list="datalist"placeholder="search" class="form-control">
                        <datalist id="datalist">
                            <option value="Mumbai">Mumbai</option>
                            <option value="Delhi">Delhi</option>
                            <option value="Bangalore">Bangalore</option>
                            <option value="Ahmadabad">Ahmadabad</option>
                        </datalist>
                    </div>
                    <div class="m-3">
                        <label for="address" class="form-lable">Address</label>
                        <textarea name="address" row="5" col="5" class="form-control"></textarea>
                    </div>
                    <div class="m-3 form-floating">
                        <input type="password" placeholder="password" id="floatinginput" name="password" class="form-control">
                        <label for="floatinginput">password</label>
                    </div>
                    <div class="m-3">
                        <div class="form-label">
                            range
                        </div>
                        <input type="range" class="form-range">
                    </div>
                    <div class="m-3">
                        <label for="file" class="form-lable">file</label>
                        <input type="file" class="form-control form-file">
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
