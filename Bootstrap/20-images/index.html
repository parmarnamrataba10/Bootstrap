<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Images</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container">
        <div class="row row-cols-3">
            <div class="col-md-4">
                <img  class="img-fluid"src="https://images.pexels.com/photos/158063/bellingrath-gardens-alabama-landscape-scenic-158063.jpeg" alt="nature">
            </div>
            <div class="col-md-4">
                <img  class="img-thumbnail"src="https://images.pexels.com/photos/10892318/pexels-photo-10892318.jpeg" alt="n-2">
            </div>
            <div class="col-md-4">
                <img class="img-fluid rounded-5"src="https://images.pexels.com/photos/992734/pexels-photo-992734.jpeg" alt="n-3">
            </div>
            <div class="col-md-4">
                <img class="img-fluid rounded-pill"src="https://images.pexels.com/photos/417074/pexels-photo-417074.jpeg" alt="n-4">
            </div>
            <div class="col-md-4">
                <img class="img-fluid rounded-top-5"  src="https://images.pexels.com/photos/2662116/pexels-photo-2662116.jpeg" alt="n-5">
            </div>
            <div class="col-md-4">
                <img class="img-fluid  rounded-circle" src="https://images.pexels.com/photos/1533720/pexels-photo-1533720.jpeg" alt="n-6">
            </div>
            <div class="col-md-4 float-start">
                <img class="img-fluid rounded-5" src="https://images.pexels.com/photos/247600/pexels-photo-247600.jpeg" alt="n-7">
            </div>
            <div class="col-md-4 mx-auto d-block">
                <img class="img-fluid rounded-5"src="https://images.pexels.com/photos/33200690/pexels-photo-33200690.jpeg" alt="n-8">
            </div>
            <div class="col-md-4 float-end">
                 <img  class="img-fluid rounded-5"src="https://images.pexels.com/photos/1144176/pexels-photo-1144176.jpeg" alt="n-9">
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
